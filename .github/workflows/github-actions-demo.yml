name: Update Exchange Rates

on:
  schedule:
    - cron: "0 6 1 * *"
      timezone: "Europe/London"
  workflow_dispatch:       

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev


      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('dplyr', 'openxlsx', 'readxl','rjson','jsonlite','janitor','gtools','httr','stringr','readr','tidyr','tibble','purrr'))"


      - name: Run script
        run: Rscript create-js/create_data.R

      - name: Commit updated Excel file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f data/"Exchange Rates for NIPS.xlsx"
          git commit -m "Update exchange rates $(date +'%Y-%m')" || echo "No changes"
          git push

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Exchange rate update FAILED"
          echo "Check logs in GitHub Actions"
 
