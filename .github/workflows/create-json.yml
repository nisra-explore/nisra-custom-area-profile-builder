name: Create Json

permissions:
  contents: write

on:
  schedule:
    - cron: "0 12 * * 4"
  workflow_dispatch:

jobs:
  create-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Initial diagnostics
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository contents:"
          ls -la

          echo ""
          echo "Git status:"
          git status

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c(
            'dplyr',
            'openxlsx',
            'readxl',
            'rjson',
            'jsonlite',
            'janitor',
            'gtools',
            'httr',
            'stringr',
            'readr',
            'tidyr',
            'tibble',
            'purrr'
          ))"

      - name: Verify scripts exist
        run: |
          echo "Checking scripts..."
          ls -la create-js/

      - name: Run script
        run: |
          Rscript create-js/create_data.R

      - name: Verify output files
        run: |
          echo "JSON files:"
          find . -name "*.json"

          echo ""
          echo "Excel files:"
          find . -name "*.xlsx"

          echo ""
          echo "Git status after script:"
          git status

      - name: Show Excel file details
        run: |
          if [ -f "data.json" ]; then
            echo "json file exists"
            ls -lh "data.json"

            echo ""
            echo "Git diff for file:"
            git diff --stat
          else
            echo "ERROR: json file not found"
          fi

      - name: Commit updated files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          echo "Status before commit:"
          git status

          git add -A

          git status

          git commit -m "Update data $(date +'%Y-%m')" || echo "No changes to commit"

          git push

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Data update FAILED"
          echo "Check logs in GitHub Actions"
 